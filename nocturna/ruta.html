<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rueda Nocturna · Rutas</title>
  <!-- Play CDN de Tailwind: solo para prototipar -->
<link href="./src/output.css" rel="stylesheet">
</head>

<body class="bg-slate-100 p-6 dark:bg-slate-950 dark:text-white">
  <h2 class="text-2xl font-bold mb-6 font-display">Rutas</h2>
  <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <article class="bg-white rounded-xl shadow-md p-5 dark:bg-slate-800">
      <span class="text-xs font-semibold uppercase bg-emerald-100 text-emerald-800 px-2 py-1 rounded-full">Fácil</span>
      <h3 class="text-lg font-bold mt-2">Luces del Centro</h3>
      <p class="text-slate-600 dark:text-slate-300">10 km · 2 h</p>
      <p class="text-xl font-bold">$55.000</p>
      <a href="#inscripcion" class="inline-block mt-3 px-4 py-2 rounded-full font-semibold bg-farol text-noche hover:brightness-110 focus:ring-2 focus:ring-farol/50">Inscríbete</a>
    </article>
    <article class="bg-white rounded-xl shadow-md p-5 dark:bg-slate-800">
      <span class="text-xs font-semibold uppercase bg-amber-100 text-amber-800 px-2 py-1 rounded-full">Medio</span>
      <h3 class="text-lg font-bold mt-2">Miradores de la Ciudad</h3>
      <p class="text-slate-600 dark:text-slate-300">16 km · 3 h</p>
      <p class="text-xl font-bold">$75.000</p>
      <a href="#inscripcion" class="inline-block mt-3 px-4 py-2 rounded-full font-semibold bg-farol text-noche hover:brightness-110 focus:ring-2 focus:ring-farol/50">Inscríbete</a>
    </article>
    <article class="bg-white rounded-xl shadow-md p-5 dark:bg-slate-800">
      <span class="text-xs font-semibold uppercase bg-rose-100 text-rose-800 px-2 py-1 rounded-full">Difícil</span>
      <h3 class="text-lg font-bold mt-2">Luna en Las Palmas</h3>
      <p class="text-slate-600 dark:text-slate-300">22 km · 3,5 h</p>
      <p class="text-xl font-bold">$95.000</p>
      <a href="#inscripcion" class="inline-block mt-3 px-4 py-2 rounded-full font-semibold bg-farol text-noche hover:brightness-110 focus:ring-2 focus:ring-farol/50">Inscríbete</a>
    </article>
  </section>
  <picture></picture>
</body>
</html>

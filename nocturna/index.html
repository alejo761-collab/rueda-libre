<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototipo - Botones</title>
   
    <link rel="stylesheet" href="./src/output.css">
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center gap-6">

    <h1 class="text-2xl font-bold">Librería de Componentes</h1>

    <div class="flex gap-4">
        <!-- 1. Botón Principal -->
        <button class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-2.5 rounded-lg transition focus:outline-none focus:ring-4 focus:ring-indigo-400">
            Principal
        </button>

        <!-- 2. Botón Secundario -->
        <button class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium px-5 py-2.5 rounded-lg transition focus:outline-none focus:ring-4 focus:ring-slate-400">
            Secundario
        </button>

        <!-- 3. Botón de Contorno -->
        <button class="border border-indigo-500 text-indigo-400 hover:bg-indigo-950 font-medium px-5 py-2.5 rounded-lg transition focus:outline-none focus:ring-4 focus:ring-indigo-400">
            Contorno
        </button>
    </div>

</body>
</html>

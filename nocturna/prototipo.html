<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rueda Nocturna · Prototipo</title>
<link href="./src/output.css" rel="stylesheet">
</head>
<body class="bg-slate-950">
  <section class="bg-slate-900 text-white px-6 py-16 text-center">
    <p class="uppercase tracking-wide text-sm text-amber-300 font-semibold">Nuevo · Jueves a sábado</p>
    <h1 class="text-4xl md:text-6xl font-bold mt-3">Rueda Nocturna</h1>
    <p class="text-lg text-slate-300 leading-relaxed mt-4 max-w-xl mx-auto">Descubre Medellín en bici cuando se encienden las luces</p>
    <ul class="flex justify-center gap-6 mt-6 font-semibold">
      <li>3 rutas</li>
      <li>Desde $55.000</li>
    </ul>
    <div class="mt-8 flex flex-wrap justify-center gap-4 items-center">
      
      <!-- Variante 1: Primario -->
      <button class="bg-amber-400 hover:bg-amber-300 text-slate-900 font-bold px-6 py-3 rounded-full transition-colors focus:outline-none focus:ring-4 focus:ring-amber-200">
        Principal
      </button>

      <!-- Variante 2: Secundario -->
      <button class="bg-blue-600 hover:bg-blue-700 text-slate-200 font-bold px-6 py-3 rounded-full border border-slate-700 transition-colors focus:outline-none focus:ring-4 focus:ring-slate-500">
        Secundario
      </button>

      <!-- Variante 3: Peligro / Cancelar -->
      <button class="bg-red-600 hover:bg-red-500 text-white font-bold px-6 py-3 rounded-full transition-colors focus:outline-none focus:ring-4 focus:ring-red-300">
        Cancelar
      </button>

    </div>
  </section>
</body>
</html>

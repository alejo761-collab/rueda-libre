<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rueda Nocturna · Rutas</title>
  <!-- Play CDN de Tailwind: solo para prototipar -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 p-6">
  <article class="max-w-sm bg-white border border-slate-200 rounded-xl shadow-md overflow-hidden transition-shadow hover:shadow-xl">
    <img class="w-full h-48 object-cover" src="https://picsum.photos/seed/luces/640/320" alt="Ciclistas recorriendo el centro de Medellín de noche">
    <div class="p-5 space-y-3">
      <span class="inline-block bg-emerald-100 text-emerald-800 text-xs font-semibold px-2 py-1 rounded-full">Fácil</span>
      <h3 class="text-xl font-bold text-slate-900">Luces del Centro</h3>
      <dl class="grid grid-cols-3 gap-2">
        <div><dt class="text-xs text-slate-500">Distancia</dt><dd class="font-semibold">10 km</dd></div>
        <div><dt class="text-xs text-slate-500">Duración</dt><dd class="font-semibold">2 h</dd></div>
        <div><dt class="text-xs text-slate-500">Punto de encuentro</dt><dd class="font-semibold">Sede de Rueda Libre</dd></div>
      </dl>
      <p class="text-2xl font-bold text-slate-900">$55.000</p>
      <a href="#inscripcion" class="block text-center bg-amber-400 text-slate-900 font-semibold px-6 py-3 rounded-full hover:bg-amber-300 focus:outline-hidden focus:ring-2 focus:ring-amber-200">Inscríbete</a>
    </div>
  </article>
</body>
</html>
